# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases of the Go server. Tags are `v*`, shared with the watch app: one GitHub release holds
# the server archives and images and the watch files. Run by the Release workflow
# (.github/workflows/release.yml), which puts the watch files in watch/dist first; CI checks this
# config and builds a snapshot on every push and pull request.
version: 2

project_name: almatyaqi-server

builds:
  - id: almatyaqi-server
    dir: server
    main: ./cmd/almatyaqi-server
    binary: almatyaqi-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Keep in sync with server/Makefile LDFLAGS (there the version comes from
    # `git describe` and keeps its v prefix; here {{.Version}} has none).
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    wrap_in_directory: true
    builds_info:
      mtime: '{{ .CommitDate }}'
    files:
      - src: 'README*'
        info:
          mtime: '{{ .CommitDate }}'
      - src: 'LICENSE*'
        info:
          mtime: '{{ .CommitDate }}'
      - src: 'server/deploy/*'
        dst: deploy
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'

# Docker Hub images (linux/amd64 + linux/arm64). Set DOCKERHUB_IMAGE, e.g.
# `<user>/almatyaqi-server`, and log in to Docker Hub before releasing.
dockers_v2:
  - id: almatyaqi-server
    ids: [almatyaqi-server]
    dockerfile: server/Dockerfile.goreleaser
    images:
      - '{{ .Env.DOCKERHUB_IMAGE }}'
    tags:
      - '{{ .Version }}'
      - latest
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native

release:
  name_template: 'Almaty AQI {{ .Version }}'
  # The Release workflow does not push the tag: GitHub creates it on this commit with the release.
  target_commitish: '{{ .FullCommit }}'
  prerelease: auto
  draft: false
  # The watch app's .iq and per-model .prg zip, built by the Release workflow.
  extra_files:
    - glob: ./watch/dist/*
