name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# bash -eo pipefail: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...

      - run: make build

      # The release config and all four targets, without Docker images or publishing.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=docker

  watch:
    name: Watch app (sample devices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pull requests from forks get no secrets: sign these check builds with a throwaway key.
      - name: Throwaway developer key
        run: |
          mkdir -p "$RUNNER_TEMP/key"
          openssl genrsa -out "$RUNNER_TEMP/key/key.pem" 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in "$RUNNER_TEMP/key/key.pem" -out "$RUNNER_TEMP/key/developer_key.der"

      # One device per screen class: 260 and 240 MIP, 454 AMOLED, 218, 208, 176 semi-octagon;
      # fenix7: a widget run as a super app (no widget app type, 64 KB glance).
      - name: Build
        run: |
          for d in fenix6pro fenix6s fenix7 fenix847mm fr255s fr55 descentg1; do
            scripts/ciq-docker.sh "$RUNNER_TEMP/key" build DEVICE="$d" RELEASE=1 \
              VERSION=0.0.0 COMMIT="${GITHUB_SHA::7}"
          done
