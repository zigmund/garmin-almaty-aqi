name: Release

# Manual: Actions → Release → Run workflow (from main), choose which part of the version to bump.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# bash -eo pipefail: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: release

jobs:
  version:
    name: Next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      commit: ${{ steps.next.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Source of truth: the latest vX.Y.Z tag. No tags yet → 0.0.1.
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=0.0.1
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::Tag v$next already exists"
            exit 1
          fi
          echo "Releasing $next (previous: ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  watch:
    name: Watch app
    needs: version
    runs-on: ubuntu-latest
    # Secrets live in the "release" environment, limited to the main branch.
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v5

      # The watch talks to this server; a release pointing at localhost would be useless, and
      # *.workers.dev was the retired Worker with the old API.
      - name: Check SERVER_URL
        run: |
          if [[ ! "$SERVER_URL" =~ ^https:// || "$SERVER_URL" == *localhost* || "$SERVER_URL" == *127.0.0.1* || "$SERVER_URL" == *.workers.dev* ]]; then
            echo "::error::Repository variable SERVER_URL must be the deployed server URL: https://, not localhost and not the retired *.workers.dev Worker (got '${SERVER_URL}')"
            exit 1
          fi

      # Store updates must be signed with the same key as the app's first upload.
      - name: Developer key
        env:
          CIQ_DEVELOPER_KEY_BASE64: ${{ secrets.CIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/key"
          echo "$CIQ_DEVELOPER_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/key/developer_key.der"
          test -s "$RUNNER_TEMP/key/developer_key.der" || { echo "::error::Secret CIQ_DEVELOPER_KEY_BASE64 is missing"; exit 1; }

      - name: Build .iq and per-model .prg
        run: scripts/ciq-docker.sh "$RUNNER_TEMP/key" set-manifest-version dist VERSION="$VERSION" COMMIT="$COMMIT" SERVER_URL="$SERVER_URL"

      - uses: actions/upload-artifact@v5
        with:
          name: watch
          path: watch/dist/*
          if-no-files-found: error

  release:
    name: GitHub release (server + watch)
    needs: [version, watch]
    runs-on: ubuntu-latest
    # Docker Hub secrets live in the "release" environment, limited to the main branch.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Attached to the release by goreleaser (release.extra_files in .goreleaser.yaml).
      - uses: actions/download-artifact@v6
        with:
          name: watch
          path: watch/dist

      # Docker Hub is optional: without DOCKERHUB_IMAGE the release has no images.
      - name: Docker Hub settings
        id: docker
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_IMAGE" ]; then
            echo "::warning::Repository variable DOCKERHUB_IMAGE is not set: releasing without Docker images"
            echo "skip=--skip=docker" >> "$GITHUB_OUTPUT"
          elif [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_IMAGE is set, but secret DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is missing in the release environment"
            exit 1
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - if: env.DOCKERHUB_IMAGE != ''
        uses: docker/setup-qemu-action@v3

      - if: env.DOCKERHUB_IMAGE != ''
        uses: docker/setup-buildx-action@v3

      - if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # goreleaser reads the version from a local tag. The tag is not pushed: GitHub creates
      # vX.Y.Z on this commit (release.target_commitish) together with the release, so a run
      # that fails before that leaves no tag behind and can simply be rerun. A failure after
      # the release is created (asset upload) leaves the release and tag: delete both to rerun.
      - name: Tag
        run: git tag "v$VERSION" "$GITHUB_SHA"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean ${{ steps.docker.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
